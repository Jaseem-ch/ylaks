<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Crown & Monogram Emblem -->
  <g transform="translate(10, 10)">
    <!-- Tiara / Crown Arch -->
    <path d="M 12 38 L 22 20 L 32 30 L 42 20 L 52 38 Z" fill="url(#roseGold)" />
    <circle cx="22" cy="16" r="3" fill="#d97706" />
    <circle cx="32" cy="24" r="3.5" fill="#e11d48" />
    <circle cx="42" cy="16" r="3" fill="#d97706" />
    <rect x="12" y="40" width="40" height="4" rx="2" fill="#1c1917" />
  </g>

  <!-- Brand Name Typography -->
  <text x="74" y="42" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#1c1917" letter-spacing="-0.5">
    Vogue &amp; Velvet
  </text>

  <!-- Subtitle Badge -->
  <text x="75" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#e11d48" letter-spacing="2">
    HAUTE COUTURE ATELIER
  </text>
</svg>
